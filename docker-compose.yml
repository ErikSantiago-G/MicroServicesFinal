services:
  mysql-inventario:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: inventario
    ports:
      - "3307:3306"
    volumes:
      - ./inventario-service/db/init.sql:/docker-entrypoint-initdb.d/init.sql

  mongo-catalogo:
    image: mongo:7
    ports:
      - "27018:27017"
    volumes:
      - mongo-catalogo-data:/data/db

volumes:
  mongo-catalogo-data: